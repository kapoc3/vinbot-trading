version: '3.8'

services:
  bot-scalper:
    build: .
    container_name: vinbot-scalper
    env_file:
      - .env.scalper
    volumes:
      - ./data:/app/data
      - ./logs_scalper:/app/logs
    restart: always
    depends_on:
      - db

  bot-classic:
    build: .
    container_name: vinbot-classic
    env_file:
      - .env.classic
    volumes:
      - ./data:/app/data
      - ./logs_classic:/app/logs
      - ./.env:/app/.env
    environment:
      - RSI_OVERSOLD=35.0
      - RSI_OVERBOUGHT=65.0
      - ENABLE_BTC_DIRECTIONAL_FILTER=false
      - ENABLE_RELATIVE_STRENGTH_FILTER=false
    restart: always
    depends_on:
      - db

  bot-grid:
    build: .
    container_name: vinbot-grid
    env_file:
      - .env.grid
    volumes:
      - ./data:/app/data
      - ./logs_grid:/app/logs
    restart: always
    depends_on:
      - db

  prometheus:
    image: prom/prometheus:latest
    container_name: vinbot-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    restart: always

  loki:
    image: grafana/loki:latest
    container_name: vinbot-loki
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    restart: always


  grafana:
    image: grafana/grafana:latest
    container_name: vinbot-grafana
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./data:/var/lib/grafana/data
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=frser-sqlite-datasource
    ports:
      - "3001:3000"
    depends_on:
      - loki
    restart: always

  db:
      image: postgres:15-alpine
      container_name: vinbot-db
      environment:
        - POSTGRES_USER=vinbot
        - POSTGRES_PASSWORD=vinbotpass
        - POSTGRES_DB=vinbot_db
      volumes:
        - postgres_data:/var/lib/postgresql/data
      ports:
        - "5432:5432"
      restart: always

volumes:
  prometheus_data:
  grafana_data:
  postgres_data:
