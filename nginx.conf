server {
    listen 80;
    server_name localhost;
    absolute_redirect off;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Serve static frontend files from /usr/share/nginx/html/dashboard
    location /dashboard/ {
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires -1;
        try_files $uri $uri/ =404;
    }

    # Redirect '/dashboard' (without trailing slash) and root '/' to '/dashboard/'
    location = /dashboard {
        return 301 /dashboard/;
    }

    # Redirect root '/' to '/dashboard/'
    location = / {
        return 301 /dashboard/;
    }

    # Proxy API requests to bot-classic using dynamic DNS resolution
    location /api/ {
        set $backend_upstream http://bot-classic:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
