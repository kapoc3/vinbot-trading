<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VinBot - Iniciar Sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 0;
            margin: 0;
        }
        .login-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 1rem;
        }
        .login-card {
            padding: 2.5rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            text-align: center;
        }
        .login-logo {
            font-size: 3.5rem;
            margin-bottom: -0.5rem;
        }
        .login-title h2 {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(to right, #3b82f6, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        .login-title p {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            text-align: left;
        }
        .form-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .form-input {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: var(--text-primary);
            font-family: var(--font-family);
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }
        .form-input:focus {
            outline: none;
            border-color: var(--accent-blue);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.2);
        }
        .btn-login {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 0.85rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
            font-family: var(--font-family);
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
            filter: brightness(1.1);
        }
        .btn-login:active {
            transform: translateY(0);
        }
        .error-message {
            color: var(--accent-red);
            font-size: 0.85rem;
            background: rgba(239, 68, 68, 0.1);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            border: 1px solid rgba(239, 68, 68, 0.15);
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card glass">
            <div class="login-logo">🤖</div>
            <div class="login-title">
                <h2>Acceso a VinBot</h2>
                <p>Ingresa tus credenciales para controlar el bot</p>
            </div>
            
            <div class="error-message" id="error-box"></div>
            
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group" style="margin-bottom: 1.25rem;">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" class="form-input" placeholder="admin" required autocomplete="username">
                </div>
                
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
                </div>
                
                <button type="submit" class="btn-login" style="width: 100%;">Iniciar Sesión</button>
            </form>
        </div>
    </div>
    
    <script>
        // Check if already logged in by making a test request
        async function checkSession() {
            try {
                const res = await fetch('/api/v1/dashboard');
                if (res.ok) {
                    window.location.href = 'index.html';
                }
            } catch (e) {}
        }
        checkSession();

        async function handleLogin(e) {
            e.preventDefault();
            const errorBox = document.getElementById('error-box');
            const submitBtn = document.querySelector('.btn-login');
            
            errorBox.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Autenticando...';
            
            const payload = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            };
            
            try {
                const response = await fetch('/api/v1/dashboard/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                if (response.ok) {
                    window.location.href = 'index.html';
                } else {
                    errorBox.textContent = data.detail || 'Credenciales inválidas';
                    errorBox.style.display = 'block';
                }
            } catch (error) {
                errorBox.textContent = 'Error al conectar con el bot.';
                errorBox.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Iniciar Sesión';
            }
        }
    </script>
</body>
</html>
